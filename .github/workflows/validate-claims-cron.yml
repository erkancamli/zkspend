name: validate-claims (cron)

on:
  schedule:
    - cron: "0 */6 * * *"        # her 6 saatte bir
  workflow_dispatch:              # elle tetikleme

concurrency:
  group: validate-claims
  cancel-in-progress: true        # üst üste binerse eskisini iptal et

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30           # 6 saat yerine max 30 dk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          jq --version

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show versions
        run: |
          set -euxo pipefail
          forge --version
          cast --version

      - name: Run validator (wrapper)
        env:
          RPC_URL: ${{ secrets.OG_RPC_URL }}     # yoksa wrapper public RPC'ye düşer
        run: |
          set -euxo pipefail
          bash scripts/validate_claims_wrapper.sh
